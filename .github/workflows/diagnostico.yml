name: Diagnóstico ClimAPI (temporário)

on:
  push:
    branches:
      - claude/embrapa-herbicide-opportunities-fe1wrw
    paths:
      - "src/diagnostico.py"
      - ".github/workflows/diagnostico.yml"
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sondar endpoints da ClimAPI
        env:
          EMBRAPA_CONSUMER_KEY: ${{ secrets.EMBRAPA_CONSUMER_KEY }}
          EMBRAPA_CONSUMER_SECRET: ${{ secrets.EMBRAPA_CONSUMER_SECRET }}
        run: python -m src.diagnostico
